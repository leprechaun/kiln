[project]
name = "tooling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'Laurence "laz" MacGuire', email = "ljm@thoughtworks.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
curate-provider-schema = "tooling.curate:main"
generate-manifests = "tooling.generate_manifests:main"
import = "tooling.import_schema:main"
render = "tooling.render:main"
generate-all = "tooling.generate_all:main"
render-all = "tooling.render_all:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
