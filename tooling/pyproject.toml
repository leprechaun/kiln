[project]
name = "kiln"
version = "0.1.0"
description = "KCL-first authoring pipeline for Crossplane compositions"
readme = "README.md"
authors = [
    { name = 'Laurence "laz" MacGuire', email = "ljm@thoughtworks.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
kiln = "kiln.cli:run"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
